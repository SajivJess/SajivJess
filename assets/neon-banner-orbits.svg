
<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#00202c"/>
      <stop offset="65%" stop-color="#020910"/>
      <stop offset="100%" stop-color="#010308"/>
    </radialGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00fff0" stop-opacity=".8"/>
      <stop offset="50%" stop-color="#00b8ff" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#00fff0" stop-opacity=".7"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 1H4" stroke="#00ffff" stroke-opacity=".12"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 48px;
        font-weight: 700;
        letter-spacing: 3px;
        fill: #00fff0;
        filter: url(#glow);
      }
      .subtitle {
        font-family: monospace;
        font-size: 15px;
        letter-spacing: 1px;
        fill: #a2fbff;
      }
      .eyebrow {
        font-family: monospace;
        font-size: 11px;
        letter-spacing: 4px;
        fill: #00c9d8;
      }
      .ring {
        fill: none;
        stroke: #00eaff;
        stroke-width: 1;
        stroke-opacity: .24;
      }
      .panel {
        fill: none;
        stroke: url(#border);
        stroke-width: 1;
      }
      .pill {
        fill: #00fff0;
        fill-opacity: .92;
        filter: url(#glow);
      }
      .pilltext {
        font-family: monospace;
        font-size: 12px;
        font-weight: bold;
        fill: #002027;
      }
      .orbit {
        transform-box: view-box;
        transform-origin: 600px 155px;
        animation: spin 24s linear infinite;
      }
      .reverse {
        animation-direction: reverse;
        animation-duration: 32s;
      }
      .fast {
        animation-duration: 17s;
      }
      .node {
        fill: #00fff0;
        filter: url(#glow);
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .orbit { animation: none; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#scan)"/>

  <!-- Technical frame -->
  <rect x="32" y="24" width="1136" height="272" rx="16"
        class="panel" stroke-opacity=".6"/>
  <rect x="44" y="36" width="1112" height="248" rx="12"
        class="panel" stroke-opacity=".4"/>

  <!-- Subtle circuit traces -->
  <g fill="none" stroke="#00dfff" stroke-opacity=".3">
    <path d="M65 90H155V110H205"/>
    <path d="M1135 90H1045V110H995"/>
    <path d="M65 238H150V218H205"/>
    <path d="M1135 238H1050V218H995"/>
    <circle cx="155" cy="90" r="3" class="node"/>
    <circle cx="1045" cy="90" r="3" class="node"/>
    <circle cx="150" cy="238" r="3" class="node"/>
    <circle cx="1050" cy="238" r="3" class="node"/>
  </g>

  <!-- Animated orbital intelligence motif -->
  <g>
    <circle cx="600" cy="155" r="48" class="ring"/>
    <circle cx="600" cy="155" r="78" class="ring"/>
    <circle cx="600" cy="155" r="110" class="ring"/>
    <circle cx="600" cy="155" r="145" class="ring"/>

    <g class="orbit fast">
      <circle cx="600" cy="10" r="5" class="node"/>
      <circle cx="745" cy="155" r="4" class="node"/>
      <circle cx="600" cy="300" r="5" class="node"/>
      <circle cx="455" cy="155" r="4" class="node"/>
    </g>

    <g class="orbit reverse">
      <circle cx="600" cy="77" r="4" class="node"/>
      <circle cx="678" cy="155" r="4" class="node"/>
      <circle cx="600" cy="233" r="4" class="node"/>
      <circle cx="522" cy="155" r="4" class="node"/>
    </g>
  </g>

  <!-- Main identity -->
  <text x="600" y="79" text-anchor="middle" class="eyebrow">
    ENGINEERING INTELLIGENCE INTO REALITY
  </text>

  <text x="600" y="137" text-anchor="middle" class="title">
    SAJIV JESS B I
  </text>

  <text x="600" y="168" text-anchor="middle" class="subtitle">
    APPLIED AI  •  MACHINE LEARNING  •  SYSTEMS ENGINEERING
  </text>

  <!-- Skill pills -->
  <g transform="translate(600 215)">
    <g transform="translate(-440 0)">
      <rect width="125" height="27" rx="6" class="pill"/>
      <text x="62.5" y="17.5" text-anchor="middle" class="pilltext">PYTHON</text>
    </g>
    <g transform="translate(-300 0)">
      <rect width="140" height="27" rx="6" class="pill"/>
      <text x="70" y="17.5" text-anchor="middle" class="pilltext">COMPUTER VISION</text>
    </g>
    <g transform="translate(-145 0)">
      <rect width="130" height="27" rx="6" class="pill"/>
      <text x="65" y="17.5" text-anchor="middle" class="pilltext">EDGE AI</text>
    </g>
    <g transform="translate(0 0)">
      <rect width="135" height="27" rx="6" class="pill"/>
      <text x="67.5" y="17.5" text-anchor="middle" class="pilltext">BACKEND SYSTEMS</text>
    </g>
    <g transform="translate(150 0)">
      <rect width="125" height="27" rx="6" class="pill"/>
      <text x="62.5" y="17.5" text-anchor="middle" class="pilltext">AUTOMOTIVE AI</text>
    </g>
    <g transform="translate(290 0)">
      <rect width="125" height="27" rx="6" class="pill"/>
      <text x="62.5" y="17.5" text-anchor="middle" class="pilltext">LLMs &amp; RAG</text>
    </g>
  </g>

  <!-- Bottom signature -->
  <text x="600" y="271" text-anchor="middle"
        font-family="monospace" font-size="11" letter-spacing="2"
        fill="#5caab8">
    FROM PROTOTYPE TO PRODUCTION
  </text>
</svg>
